<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MenuChef · Calendario de menús</title>
  <link rel="stylesheet" href="../CSS/menu.css" />
</head>
<body>

  <header class="topbar">
    <a class="logo" href="menu.html">Daily Food</a>
    <nav>
      <a href="menu.html" class="active">Calendario</a>
      <a href="comida.html">Comidas</a>
      <a href="perfil.html">Perfil</a>
    </nav>
  </header>

  <section class="hero">
    <button class="fab" id="btn-add" type="button">
      <span>añadir comida</span>
      <strong>+</strong>
    </button>
  </section>

  <main class="wrap">
    <section class="cal-card">

      <div class="cal-head">
        <button class="nav-btn" id="btn-prev" type="button" aria-label="Mes anterior">←</button>
        <h1 class="cal-title">
          <span id="txt-mes">enero</span>
          <span id="txt-anio" class="anio">2026</span>
        </h1>
        <button class="nav-btn" id="btn-next" type="button" aria-label="Mes siguiente">→</button>
        <button class="nav-btn" id="btn-sugerencia" type="button" title="Selección óptima de menú">🧠</button>
      </div>

      <div class="week">
        <span>Lunes</span><span>Martes</span><span>Miércoles</span>
        <span>Jueves</span><span>Viernes</span><span>Sábado</span><span>Domingo</span>
      </div>

      <div class="grid" id="grid"></div>

      <div class="legend">
        <span><i class="dot d-comida"></i> Almuerzo</span>
        <span><i class="dot d-cena"></i> Cena</span>
      </div>

      <div class="notes">
        <h4>Notas de la semana</h4>
        <textarea id="nota" rows="3" placeholder="Ej.: Comprar azafrán para la paella del viernes…"></textarea>
        <button class="btn" id="btn-nota" type="button">Guardar nota</button>
      </div>

    </section>
  </main>

  <!-- Modal: sugerencias ⭐ + catálogo completo -->
  <div class="modal" id="modal" aria-hidden="true">
    <div class="modal-card">
      <h3>Añadir comida 🍽️</h3>
      <form id="form-plato">
        <label class="campo">Fecha
          <input type="date" id="f-fecha" required />
        </label>

        <div class="campo">
          <span>⭐ Sugerencias para ti</span>
          <div id="sugerencias" class="sugerencias"></div>
        </div>

        <label class="campo">Tipo de comida
          <select id="f-tipo">
            <option value="0" selected>Almuerzo</option>
            <option value="1">Cena</option>
          </select>
        </label>

        <label class="campo">O elige del catálogo
          <select id="f-plato"></select>
        </label>

        <div class="acciones">
          <button type="button" class="btn ghost" id="btn-cancel">Cancelar</button>
          <button type="submit" class="btn">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../JS/api.js"></script>
  <script src="../JS/menu.js"></script>
</body>
</html>
